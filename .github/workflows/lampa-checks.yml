name: Original Lampa checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream:
    name: Test and package untouched Lampa source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LIS with original Lampa submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install original Lampa dependencies
        working-directory: vendor/lampa-source
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run upstream tests without modifying them
        working-directory: vendor/lampa-source
        run: npx vitest run

      - name: Build original Lampa web package
        run: |
          npm run build
          test -s dist/index.html
          test -s dist/app.min.js
          test -d dist/css
          test -d dist/vender
