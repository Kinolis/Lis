name: Lampa upstream checks

on:
  push:
    branches:
      - experiment/lampa-source
  pull_request:
    branches:
      - experiment/lampa-source
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lampa-tests:
    name: Test pinned Lampa source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LIS with pinned Lampa submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install upstream dependencies
        working-directory: vendor/lampa-source
        run: npm install --no-audit --no-fund

      - name: Run upstream tests
        working-directory: vendor/lampa-source
        run: npm test -- --run
