name: Publish GitHub Pages preview

on:
  push:
    branches:
      - main
      - lis-language-screen
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LIS and original Lampa submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install SVG renderer for the high-resolution LIS logo
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Lampa with the selected branch's LIS skin
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages preview
        id: deployment
        uses: actions/deploy-pages@v4
