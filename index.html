  const featured=movies.slice(0,10);if(!featured.length)return '<div class="content"><p class="muted">Загружаем настоящий каталог LIS…</p></div>';
  const h=featured[heroIndex%featured.length];
  return '<section class="hero"><div class="hero-bg" style="background-image:url(https://image.tmdb.org/t/p/original/'+h.back+')"></div><div class="hero-copy"><div class="eyebrow">✦ ВЫБОР LIS · '+h.type.toUpperCase()+'</div><h1>'+h.title+'</h1><div class="meta"><b>★ '+h.rating+'</b><span>'+h.year+'</span><span>'+h.type+'</span></div><p>'+h.desc+'</p><div class="actions"><button class="btn primary" onclick="openDetail('+movies.indexOf(h)+')">▶ Смотреть</button><button class="btn" onclick="toggleSave('+movies.indexOf(h)+')">＋ В моё</button></div><div class="hero-dots">'+Array.from({length:Math.min(10,featured.length)},(_,i)=>'<button class="dot '+(i===heroIndex?'active':'')+'" onclick="heroIndex='+i+';render()"></button>').join('')+'</div></div></section><div class="content">'+rail('Продолжить просмотр',movies.slice(0,3))+rail('Популярное',movies.slice(0,12))+rail('Новинки',liveUpcoming.length?liveUpcoming:movies.slice(8,16))+rail('Рекомендации',liveTop.length?liveTop.slice(0,12):movies.slice(4,16))+rail('Фильмы',liveMovies.slice(0,12))+rail('Сериалы',liveShows.slice(0,12))+rail('Лучшие оценки',liveTop.slice(0,12))+rail('Скоро выйдут',liveUpcoming.slice(0,12))+rail('Подборки по жанрам',movies.slice(12,24))+rail('Смотреть позже',later.map(i=>movies[i]).filter(Boolean))+'</div>';
}
let liveMovies=[],liveShows=[],liveAnimation=[],liveAnime=[],liveTop=[],liveUpcoming=[],searchTimer=null;
function fromTMDB(item,kind){
  const isTV=kind==='tv';
  const date=item.release_date||'';
  return {id:item.id,title:item.title||'',year:date?date.slice(0,4):'—',type:isTV?'Сериал':'Фильм',rating:Number(item.vote_average||0).toFixed(1),quality:'',genre:'',poster:(item.poster_path||'').replace(/^\//,''),back:(item.backdrop_path||item.poster_path||'').replace(/^\//,''),desc:item.overview||'',tmdbId:item.id,mediaType:kind};
}
async function tmdbList(kind,category='popular',pageNo=1){
  const r=await fetch('/api/tmdb?action=discover&type='+kind+'&category='+category+'&page='+pageNo);
  if(!r.ok) throw new Error('TMDB '+r.status);
  const d=await r.json();return (d.results||[]).map(x=>fromTMDB(x,kind)).filter(x=>x.poster);
}
async function loadRealCatalog(){
  try{
    const [films,shows,animation,anime,top,upcoming]=await Promise.all([
      tmdbList('movie','popular'),tmdbList('tv','popular'),tmdbList('movie','animation'),tmdbList('tv','anime'),tmdbList('movie','top_rated'),tmdbList('movie','upcoming')
    ]);
    animation.forEach(m=>m.type='Мультфильм');anime.forEach(m=>m.type='Аниме');
    liveMovies=films;liveShows=shows;liveAnimation=animation;liveAnime=anime;liveTop=top;liveUpcoming=upcoming;
    const all=[...films,...shows,...animation,...anime];
    const seen=new Set();const merged=all.filter(m=>{const k=m.mediaType+':'+m.tmdbId;if(seen.has(k))return false;seen.add(k);return true;});
    movies.splice(0,movies.length,...merged);
    if(page==='Главная'||page==='Каталог')render();
  }catch(e){console.warn('TMDB catalog unavailable',e);}
}
function catalog(){
  let types=['Фильмы','Сериалы','Мультфильмы','Аниме','Шоу','ТВ'];
  let list=activeType==='ТВ'?[]:activeType==='Фильмы'?liveMovies:activeType==='Сериалы'?liveShows:activeType==='Мультфильмы'?liveAnimation:activeType==='Аниме'?liveAnime:[];
  const label=activeType==='Фильмы'?'Фильмы':activeType==='Сериалы'?'Сериалы':activeType;
  return '<div class="content"><h1 class="page-title">Каталог</h1><div class="tabs">'+types.map(t=>'<button class="pill '+(activeType===t?'active':'')+'" onclick="activeType=\''+t+'\';render()">'+t+'</button>').join('')+'</div><div class="toolbar"><strong>'+(activeType==='ТВ'?'Телевидение':'Популярное · '+label.toLowerCase())+'</strong><div class="filters"><button class="pill">Фильтры</button><button class="pill">Сортировка</button></div></div>'+(activeType==='ТВ'?'<button class="btn primary" onclick="go(\'ТВ\')">Открыть телеканалы →</button>':'<div class="catalog-grid">'+(list.length?list.map(card).join(''):'<p class="muted">В этой категории пока нет отдельной подборки TMDB.</p>')+'</div><button class="btn" style="margin-top:22px" onclick="loadMoreCatalog()">Загрузить ещё</button>')+'</div>';
}
async function loadMoreCatalog(){
  const kind=activeType==='Сериалы'?'tv':'movie';
  const list=await tmdbList(kind,'popular',2);
  const target=kind==='tv'?liveShows:liveMovies;target.push(...list);movies.push(...list);render();
}
function searchPage(){
  return '<div class="content"><h1 class="page-title">Поиск</h1><input class="searchbox" placeholder="Название фильма, сериала или другого контента" value="'+query.replace(/"/g,'&quot;')+'" oninput="query=this.value;renderSearchResults()"><div id="searchResults" class="search-results">'+(query?'<p class="muted">Ищем в каталоге TMDB…</p>':'<p class="muted">Начни вводить название — результаты появятся здесь.</p>')+'</div></div>';
}
async function renderSearchResults(){
  clearTimeout(searchTimer);
  const q=query.trim();const res=document.getElementById('searchResults');if(!res)return;
  if(!q){res.innerHTML='<p class="muted">Начни вводить название — результаты появятся здесь.</p>';return;}
  res.innerHTML='<p class="muted">Ищем в каталоге TMDB…</p>';
  searchTimer=setTimeout(async()=>{
    try{
      const [a,b]=await Promise.all(['movie','tv'].map(async kind=>{
        const r=await fetch('/api/tmdb?action=search&type='+kind+'&q='+encodeURIComponent(q));
        if(!r.ok)throw new Error('Search failed');const d=await r.json();return (d.results||[]).map(x=>fromTMDB(x,kind));
      }));
      const films=a.filter(x=>x.poster),shows=b.filter(x=>x.poster);
      [...films,...shows].forEach(m=>{if(!movies.some(x=>x.mediaType===m.mediaType&&x.tmdbId===m.tmdbId))movies.push(m);});
      const group=(name,items)=>items.length?rail(name,items):'';
      res.innerHTML=group('Фильмы',films)+group('Сериалы',shows)||'<p class="muted">Ничего не найдено.</p>';
    }catch(e){res.innerHTML='<p class="muted">Не удалось выполнить поиск. Попробуй ещё раз.</p>';}
  },350);
}
function myPage(){let list=saved.map(i=>movies[i]);let watch=later.map(i=>movies[i]);return '<div class="content"><h1 class="page-title">Моё</h1><div class="tabs"><button class="pill active">Продолжить</button><button class="pill" onclick="document.getElementById(\'mySaved\').scrollIntoView({behavior:\'smooth\'})">Избранное</button><button class="pill" onclick="document.getElementById(\'myLater\').scrollIntoView({behavior:\'smooth\'})">Смотреть позже</button><button class="pill" onclick="document.getElementById(\'myHistory\').scrollIntoView({behavior:\'smooth\'})">История</button><button class="pill">Мои списки</button></div>'+rail('Продолжить просмотр',[movies[0],movies[3],movies[4]])+'<div id="mySaved">'+rail('Избранное',list)+'</div><div id="myLater">'+rail('Смотреть позже',watch)+'</div><div id="myHistory">'+rail('История просмотров',history.map(i=>movies[i]).filter(Boolean))+'</div></div>'}
function profilePage(){return '<div class="content"><h1 class="page-title">Профиль</h1><div class="panel profile-head"><div class="avatar">☺</div><div><h2 style="margin:0 0 5px">Мой профиль</h2><div class="muted">Войди в аккаунт, чтобы синхронизировать библиотеку</div></div></div><div class="profile-menu"><button><strong>Аккаунт</strong><small>Личные данные и пароль</small></button><button><strong>Подписка</strong><small>Тариф и платежи</small></button><button><strong>Язык интерфейса</strong><small>Русский</small></button><button><strong>Качество видео</strong><small>Автоматически</small></button><button><strong>Озвучка и субтитры</strong><small>Предпочитаемые дорожки</small></button><button><strong>Автовоспроизведение</strong><small>Следующая серия</small></button><button><strong>Уведомления</strong><small>Настройки оповещений</small></button><button><strong>Устройства и безопасность</strong><small>Активные сеансы</small></button><button><strong>Помощь и поддержка</strong><small>Связаться с нами</small></button><button><strong>О приложении LIS</strong><small>Версия и документы</small></button></div></div>'}
function tvPage(){return '<div class="content"><h1 class="page-title">ТВ</h1><div class="panel"><div class="section-head"><h2>'+channel+'</h2><span class="muted">● ПРЯМОЙ ЭФИР</span></div><div class="tv-player">▶　Окно прямого эфира</div><div class="actions" style="margin-top:14px"><button class="btn primary">▶ Смотреть эфир</button><button class="btn">Аудиодорожка</button><button class="btn">Субтитры</button></div></div><section class="section" style="margin-top:28px"><h2>Телеканалы</h2><div class="channel-row">'+channels.map(c=>'<button class="channel '+(channel===c?'active':'')+'" onclick="channel=\''+c+'\';render()">'+c+'</button>').join('')+'</div></section><section class="section"><h2>Программа передач</h2><div class="tabs">'+['Сейчас','Далее','Сегодня','Завтра'].map(t=>'<button class="pill '+(tvTab===t?'active':'')+'" onclick="tvTab=\''+t+'\';render()">'+t+'</button>').join('')+'</div>'+[['14:00–15:00','Текущая передача'],['15:00–16:00','Следующая передача'],['16:00–17:00','Вечерняя программа']].map(x=>'<div class="program"><strong>'+x[1]+'</strong><small>'+x[0]+'</small></div>').join('')+'</section></div>'}
let detailIndex=-1;function openDetail(i){let m=movies[i];if(!m)return;if(detailIndex!==i){season=1;episode=1;expanded=false;detailIndex=i;}page='Детали';setActive();let episodic=!!m.seasons;document.getElementById('app').innerHTML='<section class="detail-hero" style="background-image:url(https://image.tmdb.org/t/p/original/'+m.back+')"><div class="detail-copy"><div class="eyebrow">'+m.type.toUpperCase()+'</div><h1>'+m.title+'</h1><div class="meta"><b>★ '+m.rating+'</b><span>'+m.year+'</span><span>'+m.type+'</span><span>'+m.genre+'</span></div><div class="actions" style="margin-top:20px"><button class="btn primary" onclick="alert(\'Видеоплеер подключим при интеграции источников\')">▶ Смотреть</button><button class="btn" onclick="toggleSave('+i+')">＋ В моё</button><button class="btn">Поделиться</button></div></div></section><div class="detail-content">'+(episodic?'<section class="detail-block"><h2>Сезоны</h2><div class="season-row">'+Array.from({length:m.seasons},(_,n)=>'<button class="season '+(season===n+1?'active':'')+'" onclick="season='+ (n+1) +';episode=1;openDetail('+i+')">Сезон '+(n+1)+'</button>').join('')+'</div><h2>Серии · Сезон '+season+'</h2><div class="episode-row">'+Array.from({length:10},(_,n)=>'<button class="episode '+(episode===n+1?'active':'')+'" onclick="episode='+ (n+1) +';document.querySelectorAll(\'.episode\').forEach((e,j)=>e.classList.toggle(\'active\',j==='+n+'))"><div class="episode-thumb">▶</div><strong>Серия '+(n+1)+'</strong><small>Около 45 мин</small></button>').join('')+'</div></section>':'')+'<section class="detail-block"><div class="select-row"><div class="select-wrap"><label>Озвучка</label><select><option>Русская озвучка</option><option>Оригинальная дорожка</option><option>Другие доступные варианты</option></select></div><div class="select-wrap"><label>Субтитры</label><select><option>Без субтитров</option><option>Русские</option><option>Английские</option></select></div></div></section><button class="btn primary" onclick="alert(\'Видеоплеер подключим при интеграции источников\')">▶ '+(episodic?'Смотреть сезон '+season+' · серию '+episode:'Смотреть фильм')+'</button><section class="detail-block"><h2>Описание</h2><p class="description">'+m.desc+(expanded?' История раскрывает персонажей, их решения и мир, в котором разворачиваются события.':'')+'</p><button class="text-btn" onclick="expanded=!expanded;openDetail('+i+')">'+(expanded?'Свернуть описание':'Читать полностью')+'</button></section><section class="detail-block"><h2>Трейлер</h2><button class="btn">▶ Смотреть трейлер</button></section><section class="detail-block"><h2>Информация</h2><div class="info-grid"><div class="info-item"><span>Год выпуска</span>'+m.year+'</div><div class="info-item"><span>Тип</span>'+m.type+'</div><div class="info-item"><span>Жанр</span>'+m.genre+'</div><div class="info-item"><span>Рейтинг</span>★ '+m.rating+'</div></div></section>'+rail('Похожие материалы',movies.filter((x,j)=>j!==i).slice(0,6))+'</div>';window.scrollTo(0,0);history=[i,...history.filter(x=>x!==i)].slice(0,20);localStorage.setItem('lis-history',JSON.stringify(history))}
function toggleSave(i){saved=saved.includes(i)?saved.filter(x=>x!==i):[...saved,i];localStorage.setItem('lis-saved',JSON.stringify(saved));if(page==='Моё')render()}
async function hydratePosters(){
  const jobs = movies.map(async (m) => {
    try {
      const kind = m.type === 'Сериал' ? 'tv' : 'movie';
      const response = await fetch('/api/tmdb?q=' + encodeURIComponent(m.title) + '&type=' + kind);
      if (!response.ok) return;
      const data = await response.json();
      const result = (data.results || []).find(item => item.poster_path) || (data.results || [])[0];
      if (!result) return;
      if (result.poster_path) m.poster = result.poster_path.replace(/^\//, '');
      if (result.backdrop_path) m.back = result.backdrop_path.replace(/^\//, '');
      if (result.overview && (!m.desc || m.desc.length < 25)) m.desc = result.overview;
    } catch (error) { /* Keep existing fallback artwork when TMDB is unavailable. */ }
  });
  await Promise.all(jobs);
  if (page === 'Детали' && detailIndex >= 0) openDetail(detailIndex);
  else render();
}
setInterval(()=>{if(page==='Главная'){heroIndex=(heroIndex+1)%10;render()}},10000);
render();
loadRealCatalog();
hydratePosters();
</script></body></html>
