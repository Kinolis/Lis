/* Unified neutral transparent smoked-glass system */

}

  return '<div class="content"><h1 class="page-title">Поиск</h1><input class="searchbox" placeholder="Название фильма, сериала или другого контента" value="'+query.replace(/"/g,'&quot;')+'" oninput="query=this.value;renderSearchResults()"><div id="searchResults" class="search-results">'+(query?'<p class="muted">Ищем в каталоге TMDB…</p>':'<p class="muted">Начни вводить название — результаты появятся здесь.</p>')+'</div></div>';
}
async function renderSearchResults(){
  clearTimeout(searchTimer);
  const q=query.trim();const res=document.getElementById('searchResults');if(!res)return;
  if(!q){res.innerHTML='<p class="muted">Начни вводить название — результаты появятся здесь.</p>';return;}
  res.innerHTML='<p class="muted">Ищем в каталоге TMDB…</p>';
  searchTimer=setTimeout(async()=>{
    try{
      const [a,b]=await Promise.all(['movie','tv'].map(async kind=>{
        const r=await fetch('/api/tmdb?action=search&type='+kind+'&q='+encodeURIComponent(q));
        if(!r.ok)throw new Error('Search failed');const d=await r.json();return (d.results||[]).map(x=>fromTMDB(x,kind));
      }));
      const films=a.filter(x=>x.poster),shows=b.filter(x=>x.poster);
      [...films,...shows].forEach(m=>{if(!movies.some(x=>x.mediaType===m.mediaType&&x.tmdbId===m.tmdbId))movies.push(m);});
      const group=(name,items)=>items.length?rail(name,items):'';
      res.innerHTML=group('Фильмы',films)+group('Сериалы',shows)||'<p class="muted">Ничего не найдено.</p>';
    }catch(e){res.innerHTML='<p class="muted">Не удалось выполнить поиск. Попробуй ещё раз.</p>';}
  },350);
}

let detailIndex=-1;function openDetail(i){let m=movies[i];if(!m)return;if(detailIndex!==i){season=1;episode=1;expanded=false;detailIndex=i;}page='Детали';setActive();let episodic=!!m.seasons;document.getElementById('app').innerHTML='<section class="detail-hero" style="background-image:url(https://image.tmdb.org/t/p/original/'+m.back+')"><div class="detail-copy"><div class="eyebrow">'+m.type.toUpperCase()+'</div><div class="detail-title-wrap" id="detailTitle"><h1>'+m.title+'</h1></div><div class="meta"><b>★ '+m.rating+'</b><span>'+m.year+'</span><span>'+m.type+'</span><span>'+m.genre+'</span></div><div class="actions detail-actions" style="margin-top:20px"><button class="btn detail-save" onclick="toggleSave('+i+')">'+(saved.includes(libraryKey(m))?'✓ В моём':'＋ В моё')+'</button><button class="btn detail-share" onclick="shareDetail('+i+')">Поделиться</button></div></div></section><div class="detail-content">'+(episodic?'<section class="detail-block"><h2>Сезоны</h2><div class="season-row">'+Array.from({length:m.seasons},(_,n)=>'<button class="season '+(season===n+1?'active':'')+'" onclick="season='+ (n+1) +';episode=1;openDetail('+i+')">Сезон '+(n+1)+'</button>').join('')+'</div><h2>Серии · Сезон '+season+'</h2><div class="episode-row">'+Array.from({length:10},(_,n)=>'<button class="episode '+(episode===n+1?'active':'')+'" onclick="episode='+ (n+1) +';document.querySelectorAll(\'.episode\').forEach((e,j)=>e.classList.toggle(\'active\',j==='+n+'))"><div class="episode-thumb">▶</div><strong>Серия '+(n+1)+'</strong><small>Около 45 мин</small></button>').join('')+'</div></section>':'')+'<section class="detail-block"><div class="select-row"><div class="select-wrap"><label>Озвучка</label><select><option>Русская озвучка</option><option>Оригинальная дорожка</option><option>Другие доступные варианты</option></select></div><div class="select-wrap"><label>Субтитры</label><select><option>Без субтитров</option><option>Русские</option><option>Английские</option></select></div></div></section><button class="btn primary" onclick="alert(\'Видеоплеер пока не подключён\')">'+(episodic?'Смотреть сезон '+season+' · серию '+episode:'Смотреть фильм')+'</button><section class="detail-block"><h2>Описание</h2><p class="description '+(expanded?'expanded':'')+'">'+m.desc+'</p><button class="text-btn" onclick="expanded=!expanded;openDetail('+i+')">'+(expanded?'Свернуть описание':'Читать полностью')+'</button></section><section class="detail-block"><h2>Трейлер</h2><button class="btn" onclick="loadDetailTrailer('+i+')">Смотреть трейлер</button><div id="detailTrailer" style="margin-top:14px"></div></section><section class="detail-block cast-block"><h2>Актёры</h2><div class="cast-row" id="detailCast"><p class="muted">Загружаем актёрский состав…</p></div></section><div id="detailRelated"></div></div>';window.scrollTo(0,0);const key=libraryKey(m);history=[key||i,...history.filter(x=>x!==(key||i))].slice(0,30);storeLibrary('history',history);loadDetailLogo(m);loadDetailCast(m);loadDetailRelated(m)}
async function loadDetailRelated(m){
  const host=document.getElementById('detailRelated');
  if(!host||!m.tmdbId)return;
  try{
    const kind=m.mediaType==='tv'||m.type==='Сериал'?'tv':'movie';
    const response=await fetch('/api/tmdb?action=related&type='+kind+'&id='+encodeURIComponent(m.tmdbId));
    if(!response.ok)return;
    const data=await response.json();
    if(!document.getElementById('detailRelated'))return;
    const addItems=items=>(items||[]).filter(x=>x.poster_path).map(x=>{
      let found=movies.find(y=>y.tmdbId===x.id);
      if(!found){found=fromTMDB(x,kind);movies.push(found)}
      return found;
    });
    const parts=addItems(data.franchise?.parts).filter(x=>x.tmdbId!==m.tmdbId);
    const similar=addItems(data.similar).filter(x=>x.tmdbId!==m.tmdbId);
    host.innerHTML=(data.franchise&&parts.length?rail('Франшиза · '+escapeHTML(data.franchise.name),parts):'')+(similar.length?rail('Похожие фильмы и сериалы',similar):'');
    if(!host.innerHTML)host.innerHTML='<p class="muted">Подборки пока недоступны</p>';
  }catch(e){if(host)host.innerHTML='';}
}

async function shareDetail(i){
  const m=movies[i];if(!m)return;
  const shareUrl=new URL(location.href);if(m.tmdbId){shareUrl.searchParams.set('lis',String(m.tmdbId));shareUrl.searchParams.set('type',m.mediaType==='tv'?'tv':'movie');}else{shareUrl.searchParams.set('title',m.title);}
  const payload={title:m.title+' — LIS',text:'Смотри информацию о фильме «'+m.title+'» в LIS',url:shareUrl};
  try{
    if(navigator.share)await navigator.share(payload);
    else if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(payload.text+' '+shareUrl);alert('Ссылка скопирована');}
    else alert(shareUrl);
  }catch(e){if(e&&e.name!=='AbortError')console.warn('Share failed',e);}
}
async function openSharedTitle(){const params=new URLSearchParams(location.search),id=params.get('lis'),kind=params.get('type')==='tv'?'tv':'movie';if(!id||!/^\d+$/.test(id))return;try{const response=await fetch('/api/tmdb?action=details&type='+kind+'&id='+encodeURIComponent(id));if(!response.ok)return;const data=await response.json();if(!data.item)return;let index=movies.findIndex(x=>String(x.tmdbId)===String(data.item.id)&&x.mediaType===kind);if(index<0){movies.push(fromTMDB(data.item,kind));index=movies.length-1;}openDetail(index);}catch(e){console.warn('Shared title could not be opened',e);}}
async function loadDetailTrailer(i){
  const m=movies[i],host=document.getElementById('detailTrailer');if(!m||!host)return;
  if(!m.tmdbId){host.innerHTML='<p class="muted">Трейлер пока недоступен</p>';return;}
  host.innerHTML='<p class="muted">Ищем трейлер…</p>';
  try{
    const kind=m.mediaType==='tv'||m.type==='Сериал'?'tv':'movie';
    const response=await fetch('/api/tmdb?action=videos&type='+kind+'&id='+encodeURIComponent(m.tmdbId));
    if(!response.ok)throw new Error('Trailer request failed');
    const data=await response.json(),videos=data.videos||[];
    const video=videos.find(v=>v.site==='YouTube'&&v.type==='Trailer'&&v.official)||videos.find(v=>v.site==='YouTube'&&v.type==='Trailer')||videos.find(v=>v.site==='YouTube');
    if(!video){host.innerHTML='<p class="muted">Официальный трейлер не найден</p>';return;}
    host.innerHTML='<div class="tv-player"><iframe title="Трейлер '+escapeHTML(m.title)+'" src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(video.key)+'" style="width:100%;height:100%;border:0;border-radius:16px" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></div>';
  }catch(e){host.innerHTML='<p class="muted">Не удалось загрузить трейлер. Попробуй позже.</p>';}
}

async function loadDetailCast(m){
  const target=document.getElementById('detailCast');
  if(!target||!m.tmdbId)return;
  try{
    const kind=m.mediaType==='tv'||m.type==='Сериал'?'tv':'movie';
    const response=await fetch('/api/tmdb?action=credits&type='+kind+'&id='+encodeURIComponent(m.tmdbId));
    if(!response.ok)throw new Error('Credits request failed');
    const data=await response.json();
    const cast=data.cast||[];
    if(!document.getElementById('detailCast'))return;
    if(!cast.length){target.innerHTML='<p class="muted">Информация об актёрах пока недоступна</p>';return;}
    target.innerHTML=cast.map(person=>'<article class="cast-card">'+(person.profile_path?'<img loading="lazy" src="https://image.tmdb.org/t/p/w185'+person.profile_path+'" alt="">':'<div class="cast-placeholder">LIS</div>')+'<strong>'+escapeHTML(person.name)+'</strong>'+(person.character?'<span>'+escapeHTML(person.character)+'</span>':'')+'</article>').join('');
  }catch(e){if(target)target.innerHTML='<p class="muted">Актёрский состав пока недоступен</p>';}
}
function escapeHTML(value){return String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function loadDetailLogo(m){
  const wrap=document.getElementById('detailTitle');
  if(!wrap||!m.tmdbId)return;
  try{
    const kind=m.mediaType==='tv'||m.type==='Сериал'?'tv':'movie';
    const response=await fetch('/api/tmdb?action=images&type='+kind+'&id='+encodeURIComponent(m.tmdbId));
    if(!response.ok)return;
    const data=await response.json();
    const logos=data.logos||[];
    const logo=logos.find(x=>x.iso_639_1==='ru')||logos.find(x=>x.iso_639_1==='en')||logos.find(x=>!x.iso_639_1)||logos[0];
    if(!logo||!logo.file_path||!document.getElementById('detailTitle'))return;
    const img=document.createElement('img');
    img.className='detail-title-logo';
    img.alt=m.title;
    img.src='https://image.tmdb.org/t/p/w500'+logo.file_path;
    img.onerror=()=>{if(wrap&&!wrap.querySelector('h1'))wrap.innerHTML='<h1>'+m.title+'</h1>'};
    wrap.replaceChildren(img);
  }catch(e){console.warn('TMDB title logo unavailable',e);}
}
function toggleSave(i){const m=movies[i],key=libraryKey(m);if(!m||!key)return;const current=saved.map(x=>typeof x==='string'?x:(libraryKey(movies[x])||''));saved=current.includes(key)?current.filter(x=>x!==key):[key,...current.filter(Boolean)];storeLibrary('saved',saved);openDetail(i)}
async function hydratePosters(){
  const jobs = movies.map(async (m) => {
    try {
      const kind = m.type === 'Сериал' ? 'tv' : 'movie';
      const response = await fetch('/api/tmdb?q=' + encodeURIComponent(m.title) + '&type=' + kind);
      if (!response.ok) return;
      const data = await response.json();
      const result = (data.results || []).find(item => item.poster_path) || (data.results || [])[0];
      if (!result) return;
      if (result.poster_path) m.poster = result.poster_path.replace(/^\//, '');
      m.tmdbId=result.id;m.mediaType=kind;
      if (result.backdrop_path) m.back = result.backdrop_path.replace(/^\//, '');
      if (result.overview && (!m.desc || m.desc.length < 25)) m.desc = result.overview;
    } catch (error) { /* Keep existing fallback artwork when TMDB is unavailable. */ }
  });
  await Promise.all(jobs);
  if (page === 'Детали' && detailIndex >= 0) openDetail(detailIndex);
  else render();
}
